name: verify-organic-scribble-v2

on:
  push:
    branches:
      - agent/organic-scribble-v2

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.head_commit.message == 'organic scribble verification 4'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: python -m pip install uv
      - run: python -m uv sync --all-extras --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @plotterapp/web exec playwright install --with-deps chromium
      - name: Apply organic scribble implementation
        run: |
          python scripts/apply_organic_scribble_v2.py
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/plotter_core/tests/test_circular_scribble.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace("import math\n", "import math\nfrom itertools import pairwise\n", 1)
          text = text.replace(
              "for first, second in zip(points, points[1:], strict=False)",
              "for first, second in pairwise(points)",
              1,
          )
          text = text.replace(
              "for first, second in zip(centres, centres[1:], strict=False)",
              "for first, second in pairwise(centres)",
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Format changed files
        run: |
          uv run ruff format packages/plotter_core/plotter_core/importers/raster_vectorize.py packages/plotter_core/tests/test_circular_scribble.py services/api/plotterapp_api/main.py
          pnpm --filter @plotterapp/web exec prettier --write src/App.tsx src/App.test.tsx ../../README.md
      - name: Remove staging helper before verification
        run: rm scripts/apply_organic_scribble_v2.py
      - name: Verify static checks
        run: |
          uv run ruff check .
          uv run ruff format --check .
          pnpm lint
          pnpm format:check
          uv run python -m mypy
          pnpm typecheck
      - name: Verify Python tests against current baseline
        run: |
          set +e
          uv run python -m pytest --tb=no -q 2>&1 | tee /tmp/organic-scribble-python-tests.log
          PYTEST_STATUS=${PIPESTATUS[0]}
          set -e
          export PYTEST_STATUS
          uv run python - <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path

          expected_baseline_failures = {
              "packages/plotter_core/tests/test_map_to_glyphscape.py::test_circuit_metropolis_matches_reviewed_golden_fixture",
              "packages/plotter_core/tests/test_procedural_generators.py::test_generators_are_deterministic_bounded_and_finite[builtin.flow-field]",
              "packages/plotter_core/tests/test_procedural_generators.py::test_generators_are_deterministic_bounded_and_finite[builtin.topographic-contours]",
              "packages/plotter_core/tests/test_procedural_generators.py::test_generators_are_deterministic_bounded_and_finite[builtin.truchet]",
              "packages/plotter_core/tests/test_procedural_generators.py::test_generators_are_deterministic_bounded_and_finite[builtin.guilloche]",
              "packages/plotter_core/tests/test_raster_vectorize.py::test_raster_algorithms_are_deterministic_finite_and_page_space[hatch]",
              "packages/plotter_core/tests/test_raster_vectorize.py::test_raster_algorithms_are_deterministic_finite_and_page_space[crosshatch]",
              "packages/plotter_core/tests/test_raster_vectorize.py::test_dither_dots_are_ordered_closed_marks_and_settings_change_geometry",
              "packages/plotter_core/tests/test_raster_vectorize.py::test_dither_contrast_bands_emit_stable_layers_for_pen_mapping",
              "packages/plotter_core/tests/test_raster_vectorize.py::test_color_quantization_emits_stable_source_roles_independent_of_pens[color-hatch]",
          }
          output = Path("/tmp/organic-scribble-python-tests.log").read_text(encoding="utf-8")
          failures = {
              line.removeprefix("FAILED ").split(" - ", 1)[0]
              for line in output.splitlines()
              if line.startswith("FAILED ")
          }
          errors = [line for line in output.splitlines() if line.startswith("ERROR ")]
          unexpected = failures - expected_baseline_failures
          status = int(os.environ["PYTEST_STATUS"])
          if errors or unexpected or (status != 0 and not failures):
              raise SystemExit(
                  "Python verification found unexpected failures or errors\n"
                  f"unexpected={sorted(unexpected)}\nerrors={errors}\nstatus={status}"
              )
          print(
              f"Python suite passed apart from {len(failures)} known baseline golden-hash failures"
          )
          PY
      - name: Verify web unit tests
        run: pnpm test
      - name: Verify end to end
        run: pnpm e2e
      - name: Upload Python test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: organic-scribble-python-tests
          path: /tmp/organic-scribble-python-tests.log
          if-no-files-found: ignore
      - name: Commit verified implementation
        run: |
          rm .github/workflows/verify-organic-scribble-v2.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Implement organic tone-aware circular scribbles"
          git push origin HEAD:agent/organic-scribble-v2
