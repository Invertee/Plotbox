name: verify-organic-scribble-v2

on:
  push:
    branches:
      - agent/organic-scribble-v2

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.head_commit.message == 'organic scribble verification'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: python -m pip install uv
      - run: python -m uv sync --all-extras --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @plotterapp/web exec playwright install --with-deps chromium
      - name: Apply organic scribble implementation
        run: python scripts/apply_organic_scribble_v2.py
      - name: Format changed files
        run: |
          uv run ruff check --fix packages/plotter_core/plotter_core/importers/raster_vectorize.py packages/plotter_core/tests/test_circular_scribble.py services/api/plotterapp_api/main.py
          uv run ruff format packages/plotter_core/plotter_core/importers/raster_vectorize.py packages/plotter_core/tests/test_circular_scribble.py services/api/plotterapp_api/main.py
          pnpm --filter @plotterapp/web exec prettier --write src/App.tsx src/App.test.tsx ../../README.md
      - name: Verify repository
        run: |
          set -o pipefail
          make verify 2>&1 | tee /tmp/organic-scribble-verify.log
      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: organic-scribble-verify-log
          path: /tmp/organic-scribble-verify.log
          if-no-files-found: ignore
      - name: Commit verified implementation
        run: |
          rm scripts/apply_organic_scribble_v2.py .github/workflows/verify-organic-scribble-v2.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Implement organic tone-aware circular scribbles"
          git push origin HEAD:agent/organic-scribble-v2
