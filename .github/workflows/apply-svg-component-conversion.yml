name: apply-svg-component-conversion

on:
  workflow_run:
    workflows:
      - verify
    types:
      - completed

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.workflow_run.id == 33931895977
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: python -m pip install uv
      - run: python -m uv sync --all-extras --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @plotterapp/web exec playwright install --with-deps chromium
      - name: Apply prepared SVG component conversion
        run: |
          gzip -dc scripts/apply_svg_component_conversion_v0_4_0.py.gz > /tmp/apply_svg_component_conversion_v0_4_0.py
          python /tmp/apply_svg_component_conversion_v0_4_0.py
          uv run python scripts/export_schemas.py
          git restore --source=HEAD -- plotterapp.egg-info || true
      - name: Format prepared changes
        run: |
          uv run ruff format \
            packages/plotter_core/plotter_core/models.py \
            packages/plotter_core/plotter_core/projects.py \
            packages/plotter_core/plotter_core/importers/svg.py \
            packages/plotter_core/tests/test_svg_import.py \
            services/api/plotterapp_api/main.py \
            services/api/tests/test_api.py
          pnpm --filter @plotterapp/web exec prettier --write \
            src/App.tsx \
            src/SvgConversionControls.tsx \
            src/SvgConversionControls.test.tsx \
            src/types.ts \
            src/styles.css \
            ../../README.md
      - name: Verify prepared implementation
        run: make verify
      - name: Commit prepared implementation to main
        run: |
          rm -f scripts/.svg-component-trigger-v0.4.0
          rm -f scripts/apply_svg_component_conversion_v0_4_0.py.gz
          rm -f .github/workflows/apply-svg-component-conversion.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No SVG component conversion changes were produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add component-aware SVG to G-code conversion (v0.4.0)"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
