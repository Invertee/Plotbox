name: apply-svg-component-conversion

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: apply-svg-component-conversion
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.event_name == 'schedule' || github.event.head_commit.message == 'stage svg component conversion v0.4.0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: python -m pip install uv
      - run: python -m uv sync --all-extras --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @plotterapp/web exec playwright install --with-deps chromium
      - name: Apply SVG component conversion
        run: |
          gzip -dc scripts/apply_svg_component_conversion_v0_4_0.py.gz > /tmp/apply_svg_component_conversion_v0_4_0.py
          python /tmp/apply_svg_component_conversion_v0_4_0.py
          uv run python scripts/export_schemas.py
          git restore --source=HEAD -- plotterapp.egg-info || true
      - name: Format changed files
        run: |
          uv run ruff format \
            packages/plotter_core/plotter_core/models.py \
            packages/plotter_core/plotter_core/projects.py \
            packages/plotter_core/plotter_core/importers/svg.py \
            packages/plotter_core/tests/test_svg_import.py \
            services/api/plotterapp_api/main.py \
            services/api/tests/test_api.py
          pnpm --filter @plotterapp/web exec prettier --write \
            src/App.tsx \
            src/SvgConversionControls.tsx \
            src/SvgConversionControls.test.tsx \
            src/types.ts \
            src/styles.css \
            ../../README.md
      - name: Verify repository
        run: make verify
      - name: Commit implementation to main
        run: |
          git add \
            README.md \
            apps/web/src/App.tsx \
            apps/web/src/SvgConversionControls.tsx \
            apps/web/src/SvgConversionControls.test.tsx \
            apps/web/src/types.ts \
            apps/web/src/styles.css \
            packages/plotter_core/plotter_core/models.py \
            packages/plotter_core/plotter_core/projects.py \
            packages/plotter_core/plotter_core/importers/svg.py \
            packages/plotter_core/tests/test_svg_import.py \
            packages/schemas \
            services/api/plotterapp_api/main.py \
            services/api/tests/test_api.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No SVG component conversion changes were produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add component-aware SVG to G-code conversion (v0.4.0)"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
