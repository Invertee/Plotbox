name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: python -m pip install uv
      - run: python -m uv sync --all-extras --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @plotterapp/web exec playwright install --with-deps chromium
      - run: make verify
