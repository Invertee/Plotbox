name: apply-circular-scribble

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: python -m pip install uv
      - run: python -m uv sync --all-extras --locked
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @plotterapp/web exec playwright install --with-deps chromium
      - name: Apply implementation patch
        run: |
          git apply --check scripts/circular-scribble.patch
          git apply scripts/circular-scribble.patch
      - name: Format changed source
        run: |
          uv run ruff format packages/plotter_core/plotter_core/models.py packages/plotter_core/plotter_core/importers/raster_vectorize.py packages/plotter_core/tests/test_circular_scribble.py
          pnpm --filter @plotterapp/web exec prettier --write src/App.tsx src/types.ts ../../README.md
      - name: Regenerate schemas
        run: uv run python scripts/export_schemas.py
      - name: Verify repository
        run: make verify
      - name: Commit verified implementation
        run: |
          rm scripts/circular-scribble.patch .github/workflows/apply-circular-scribble.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add tone-aware circular scribble raster mode"
          git push origin HEAD:main
