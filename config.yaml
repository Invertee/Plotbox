name: Plotbox
version: 0.3.9
slug: plotbox
description: Local-first pen-plotter artwork editor and G-code generator
arch:
  - amd64
  - aarch64
init: false
ingress: false
ports:
  8787/tcp: 8787
ports_description:
  8787/tcp: Plotbox web interface
webui: http://[HOST]:[PORT:8787]
options:
  nominatim_url: https://nominatim.openstreetmap.org
  overpass_url: https://overpass-api.de/api/interpreter
  terrain_tile_url: https://elevation-tiles-prod.s3.amazonaws.com/terrarium/{z}/{x}/{y}.png
  plotbox_user_agent: Plotbox/0.2 (Home Assistant add-on)
schema:
  nominatim_url: url
  overpass_url: url
  terrain_tile_url: str
  plotbox_user_agent: str
