name: Plotbox
version: "0.3.1"
slug: plotbox
description: Artwork generation, validated G-code export, and guarded FluidNC commissioning
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
stage: experimental
ingress: true
ingress_port: 5616
ingress_stream: true
panel_icon: mdi:draw-pen
panel_title: Plotbox
panel_admin: true
ports:
  5616/tcp: 5616
ports_description:
  5616/tcp: HTTP service for Home Assistant Ingress or a trusted reverse proxy
watchdog: http://[HOST]:[PORT:5616]/api/health
backup: cold
environment:
  PLOTTERAPP_PROJECTS_ROOT: /data/projects
  PLOTTERAPP_FLUIDNC_CONFIG: /data/fluidnc.json
  PLOTTERAPP_WEB_ROOT: /app/web
  PLOTTERAPP_ALLOWED_CLIENT_NETWORKS: 172.30.32.2/32,127.0.0.0/8
options: {}
schema: {}
