name: "CoreXY Big Pen Plotter"
board: "FYSETC E4"

stepping:
  engine: RMT
  idle_ms: 255
  dir_delay_us: 1
  pulse_us: 2
  disable_delay_us: 0

# Configures the shared TMC2209 internal communication channel
uart1:
  txd_pin: gpio.22
  rxd_pin: gpio.21
  baud: 115200
  mode: 8N1

kinematics:
  corexy: {}

axes:
  shared_stepper_disable_pin: gpio.25
  x:
    steps_per_mm: 80.000        
    # Standard for GT2 belt with 20-tooth pulley. Change to 100 if 16-tooth.
    max_rate_mm_per_min: 12000.000 
    # 200 mm/s mapping speed
    acceleration_mm_per_sec2: 1500.000
    max_travel_mm: 850.000
    # Refuse commanded moves beyond the configured machine range.
    soft_limits: true
    homing:
      # Home X and Y in separate cycles because this is a CoreXY machine.
      cycle: 2
      positive_direction: false   
      # false = homes toward minimum (0). Change to true if it homes to max.
      seek_mm_per_min: 4000.000
      feed_mm_per_min: 1000.000
    motor0:
      # Both X switches are wired to the E4 X-MIN input. Either switch asserts
      # this input; FluidNC therefore treats it as a limit in either direction.
      limit_all_pin: gpio.34:low
      hard_limits: true
      pulloff_mm: 4.000
      tmc_2209:
        uart_num: 1
        addr: 1                   
        # Hardware address for X slot on E4
        step_pin: gpio.27
        direction_pin: gpio.26
        run_amps: 1.000           
        # Adjust up or down depending on your motor heat/torque needs
        hold_amps: 0.500
        homing_amps: 1.000
        microsteps: 16
        run_mode: StealthChop

  y:
    steps_per_mm: 80.000
    max_rate_mm_per_min: 12000.000
    acceleration_mm_per_sec2: 1500.000
    max_travel_mm: 850.000
    soft_limits: true
    homing:
      cycle: 3
      positive_direction: false
      seek_mm_per_min: 4000.000
      feed_mm_per_min: 1000.000
    motor0:
      # Both Y switches are wired to the E4 Y-MIN input.
      limit_all_pin: gpio.35:low
      hard_limits: true
      pulloff_mm: 4.000
      tmc_2209:
        uart_num: 1
        addr: 3                   
        # Hardware address for Y slot on E4
        step_pin: gpio.33
        direction_pin: gpio.32
        run_amps: 1.000
        hold_amps: 0.500
        homing_amps: 1.000
        microsteps: 16
        run_mode: StealthChop

  z:
    steps_per_mm: 16.000          
    # Faster pen lift/travel; test this with the pen clear of the work.
    max_rate_mm_per_min: 10000.000
    acceleration_mm_per_sec2: 2400.000
    max_travel_mm: 10.000        
    # Caps "100%" as the ceiling limit
    motor0:
      tmc_2209:
        uart_num: 1
        addr: 0                   
        # Hardware address for Z slot on E4
        step_pin: gpio.14
        direction_pin: gpio.12
        run_amps: 0.500           
        # Lower current for a small pancake motor to prevent overheating
        hold_amps: 0.250
        homing_amps: 0.500
        microsteps: 16            
        # Lower for higher torque, reduces smoothness
        run_mode: StealthChop

# Dashboard macros. FluidNC's Z range is -10..0, so keep every target inside
# that configured range. '&' separates commands within one macro line.
macros:
  macro0: G90&G0Z0
  macro1: G90&G0Z-2.5
  macro2: G90&G0Z-5
  macro3: G90&G0Z-7.5

# Do not permit motion with an unknown machine position, and alarm if a limit
# input is already active when the controller starts.
start:
  must_home: true
  check_limits: true
